name: Terminologia inclusiva

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validar-terminologia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Validar novas ocorrências da terminologia
        shell: bash
        run: |
          set -euo pipefail
          termo="tecnologia"" assistiva"
          permitido="recursos de ""tecnologia assistiva"
          nome_oficial="Centro de Inclusão Através da ""Tecnologia Assistiva"
          adicionadas="$(git diff -U0 HEAD^ HEAD -- . ':(exclude).github/workflows/terminologia.yml' | grep '^+' | grep -v '^+++' || true)"
          ocorrencias="$(printf '%s\n' "$adicionadas" | grep -i "$termo" || true)"
          invalidas="$(printf '%s\n' "$ocorrencias" | grep -vi "$permitido" | grep -vi "$nome_oficial" || true)"
          if [ -n "$invalidas" ]; then
            printf '%s\n' "$invalidas"
            echo
            echo 'Use sempre a forma padronizada com o prefixo recursos de, exceto no nome oficial do CIATA.'
            exit 1
          fi
          echo 'Terminologia das novas linhas validada.'
