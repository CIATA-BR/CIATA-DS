name: Normalizar terminologia histórica

on:
  push:
    branches:
      - docs/normaliza-terminologia-matrizes

permissions:
  contents: write

jobs:
  normalizar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/normaliza-terminologia-matrizes
          fetch-depth: 0
      - name: Corrigir concordância da forma normalizada
        shell: python
        run: |
          from pathlib import Path

          extensoes = {'.md', '.html', '.js', '.css', '.json', '.yml', '.yaml', '.txt', '.php', '.py', '.kt', '.swift', '.dart', '.xml', '.svg'}
          oficial = 'Centro de Inclusão Através da Tecnologia Assistiva'
          ajustes = [
              ('pela recursos de tecnologia assistiva', 'pelos recursos de tecnologia assistiva'),
              ('da recursos de tecnologia assistiva', 'dos recursos de tecnologia assistiva'),
              ('na recursos de tecnologia assistiva', 'nos recursos de tecnologia assistiva'),
              ('à recursos de tecnologia assistiva', 'aos recursos de tecnologia assistiva'),
              ('a recursos de tecnologia assistiva', 'os recursos de tecnologia assistiva'),
              ('uma recursos de tecnologia assistiva', 'recursos de tecnologia assistiva'),
              ('recursos de tecnologia assistiva relevante', 'recursos de tecnologia assistiva relevantes'),
              ('recursos de tecnologia assistiva usada', 'recursos de tecnologia assistiva usados'),
              ('recursos de tecnologia assistiva utilizada', 'recursos de tecnologia assistiva utilizados'),
              ('recursos de tecnologia assistiva principal', 'recursos de tecnologia assistiva principais'),
              ('Pela Recursos de Tecnologia Assistiva', 'Pelos Recursos de Tecnologia Assistiva'),
              ('Da Recursos de Tecnologia Assistiva', 'Dos Recursos de Tecnologia Assistiva'),
              ('Na Recursos de Tecnologia Assistiva', 'Nos Recursos de Tecnologia Assistiva'),
              ('À Recursos de Tecnologia Assistiva', 'Aos Recursos de Tecnologia Assistiva'),
              ('A Recursos de Tecnologia Assistiva', 'Os Recursos de Tecnologia Assistiva'),
              ('Uma Recursos de Tecnologia Assistiva', 'Recursos de Tecnologia Assistiva'),
              ('Recursos de Tecnologia Assistiva relevante', 'Recursos de Tecnologia Assistiva relevantes'),
          ]
          alterados = []

          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              if path.suffix.lower() not in extensoes:
                  continue
              if path.as_posix().startswith('.github/workflows/'):
                  continue
              try:
                  texto = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              if oficial in texto and all(origem not in texto for origem, _ in ajustes):
                  continue
              novo = texto
              for origem, destino in ajustes:
                  novo = novo.replace(origem, destino)
              if novo != texto:
                  path.write_text(novo, encoding='utf-8')
                  alterados.append(path.as_posix())

          print(f'{len(alterados)} arquivos com concordância ajustada')
          for item in alterados:
              print(item)
      - name: Commitar ajustes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Nenhum ajuste adicional necessário.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: corrige concordancia da terminologia'
          git fetch origin docs/normaliza-terminologia-matrizes
          git rebase origin/docs/normaliza-terminologia-matrizes
          git push origin HEAD:docs/normaliza-terminologia-matrizes
