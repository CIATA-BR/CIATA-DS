name: Corrigir varredura terminológica

on:
  push:
    branches:
      - docs/normaliza-terminologia-matrizes

permissions:
  contents: write

jobs:
  corrigir:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/normaliza-terminologia-matrizes
          fetch-depth: 0
      - name: Corrigir duplicações e concordância
        shell: python
        run: |
          from pathlib import Path
          import re

          exts={'.md','.html','.js','.css','.json','.yml','.yaml','.txt','.php','.py','.kt','.swift','.dart','.xml','.svg'}
          official='Centro de Inclusão Através da Tecnologia Assistiva'

          literal=[
            ('recursos de recursos de tecnologia assistiva','recursos de tecnologia assistiva'),
            ('Recursos de recursos de tecnologia assistiva','Recursos de tecnologia assistiva'),
            ('recursos de Recursos de Tecnologia Assistiva','recursos de tecnologia assistiva'),
            ('suporte os recursos de tecnologia assistiva','suporte a recursos de tecnologia assistiva'),
            ('paros recursos de tecnologia assistiva','para os recursos de tecnologia assistiva'),
            ('quem usos recursos de tecnologia assistiva','quem usa recursos de tecnologia assistiva'),
            ('impeços recursos de tecnologia assistiva','impeça recursos de tecnologia assistiva'),
            ('utilizadoss','utilizados'),
            ('relevantess','relevantes'),
            ('relevantesss','relevantes'),
          ]

          regex=[
            (r'\bTecnologia assistiva\b', 'Recursos de tecnologia assistiva'),
            (r'\bos recursos de tecnologia assistiva já anuncia\b', 'os recursos de tecnologia assistiva já anunciam'),
            (r'\bos recursos de tecnologia assistiva deve anunciar\b', 'os recursos de tecnologia assistiva devem anunciar'),
            (r'\bos recursos de tecnologia assistiva é representada\b', 'os recursos de tecnologia assistiva são representados'),
            (r'\brecursos de tecnologia assistiva real\b', 'recursos de tecnologia assistiva reais'),
            (r'\brecursos de tecnologia assistiva usada\b', 'recursos de tecnologia assistiva usados'),
            (r'\brecursos de tecnologia assistiva utilizada\b', 'recursos de tecnologia assistiva utilizados'),
            (r'\brecursos de tecnologia assistiva principal\b', 'recursos de tecnologia assistiva principais'),
          ]

          changed=[]
          for p in Path('.').rglob('*'):
            if not p.is_file() or '.git' in p.parts or p.as_posix().startswith('.github/workflows/') or p.suffix.lower() not in exts:
              continue
            try:
              text=p.read_text(encoding='utf-8')
            except UnicodeDecodeError:
              continue
            new=text
            for a,b in literal:
              while a in new:
                new=new.replace(a,b)
            for pat,repl in regex:
              new=re.sub(pat,repl,new)
            # O nome oficial é intocável; restaura caso uma linha externa o tenha alterado.
            new=new.replace('Centro de Inclusão Através da Recursos de tecnologia assistiva', official)
            if new!=text:
              p.write_text(new,encoding='utf-8')
              changed.append(p.as_posix())

          print(f'{len(changed)} arquivos corrigidos')
          for p in changed: print(p)

      - name: Verificar padrões inválidos conhecidos
        shell: python
        run: |
          from pathlib import Path
          import re, sys
          bad=[
            r'recursos de recursos de tecnologia assistiva',
            r'paros recursos de tecnologia assistiva',
            r'quem usos recursos de tecnologia assistiva',
            r'impeços recursos de tecnologia assistiva',
            r'utilizadoss', r'relevantess',
            r'os recursos de tecnologia assistiva já anuncia\b',
            r'os recursos de tecnologia assistiva deve anunciar\b',
            r'recursos de tecnologia assistiva é representada\b',
          ]
          hits=[]
          for p in Path('.').rglob('*'):
            if not p.is_file() or '.git' in p.parts or p.as_posix().startswith('.github/workflows/'):
              continue
            try: text=p.read_text(encoding='utf-8')
            except (UnicodeDecodeError, OSError): continue
            for pat in bad:
              if re.search(pat,text,re.I): hits.append(f'{p}: {pat}')
          if hits:
            print('\n'.join(hits)); sys.exit(1)
          print('Padrões inválidos conhecidos: nenhum.')

      - name: Commitar correções
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Nenhuma correção necessária.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: corrige artefatos da normalizacao terminologica'
          git fetch origin docs/normaliza-terminologia-matrizes
          git rebase origin/docs/normaliza-terminologia-matrizes
          git push origin HEAD:docs/normaliza-terminologia-matrizes
